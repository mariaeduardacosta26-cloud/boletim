<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 9º Ano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho principal com título e subtítulo -->
  <header>
    <div class="container">
      <h1>Boletim Digital</h1>
      <p class="subtitulo">9º Ano — Estudante Exemplo</p>
    </div>
  </header>

  <main class="container">
    <!-- Área de cards com resumos do estudante -->
    <section class="cards-grid">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="media-geral" class="card-valor">—</p>
      </div>

      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="total-faltas" class="card-valor">—</p>
      </div>

      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="qtd-bom-desempenho" class="card-valor">—</p>
      </div>

      <div class="card">
        <h3>Precisam de Atenção</h3>
        <p id="qtd-atencao" class="card-valor">—</p>
      </div>

      <div class="card">
        <h3>Frequência</h3>
        <p id="frequencia" class="card-valor">—</p>
        <span id="frequencia-status" class="card-status"></span>
      </div>
    </section>

    <!-- Tabela principal com as notas das disciplinas -->
    <section class="tabela-container">
      <h2>Notas por Disciplina</h2>
      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo">
            <!-- As 15 linhas das disciplinas serão inseridas via JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Inclusão do arquivo JavaScript -->
  <script src="script.js"></script>
</body>
</html>
