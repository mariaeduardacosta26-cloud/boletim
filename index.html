<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 9º Ano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho minimalista -->
  <header>
    <div class="container header-content">
      <div>
        <h1>Boletim Digital</h1>
        <p class="subtitulo">9º Ano — Estudante Exemplo</p>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Cards minimalistas -->
    <section class="cards-grid">
      <div class="card">
        <span class="card-label">Média Geral</span>
        <p id="media-geral" class="card-valor">—</p>
      </div>

      <div class="card">
        <span class="card-label">Total de Faltas</span>
        <p id="total-faltas" class="card-valor">—</p>
      </div>

      <div class="card">
        <span class="card-label">Bom Desempenho</span>
        <p id="qtd-bom-desempenho" class="card-valor">—</p>
      </div>

      <div class="card">
        <span class="card-label">Precisa de Atenção</span>
        <p id="qtd-atencao" class="card-valor">—</p>
      </div>

      <div class="card">
        <span class="card-label">Frequência</span>
        <p id="frequencia" class="card-valor">—</p>
        <span id="frequencia-status" class="card-status"></span>
      </div>
    </section>

    <!-- Tabela limpa e funcional -->
    <section class="tabela-container">
      <h2>Disciplinas</h2>
      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo">
            <!-- As disciplinas serão inseridas aqui via JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
